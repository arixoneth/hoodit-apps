name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install jsonschema==4.25.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust and validate emitted tool contracts
        shell: bash
        run: |
          fixture_dir=$(mktemp -d)
          HOODIT_CONTRACT_FIXTURE_DIR="$fixture_dir" cargo test --workspace
          python contracts/hoodit-v1/validate_contracts.py --implementation-fixtures "$fixture_dir"
      - name: Build the app outside the repository workspace
        shell: bash
        run: |
          standalone_dir=$(mktemp -d)
          cp -R apps/hoodit "$standalone_dir/hoodit"
          cp Cargo.lock "$standalone_dir/hoodit/Cargo.lock"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --locked --manifest-path "$standalone_dir/hoodit/Cargo.toml"

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npx --yes npm@10.9.2 ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
