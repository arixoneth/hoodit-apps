[package]
name = "hoodit"
version = "2.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aomi-sdk = "=5.1.1"
mpp = { version = "0.13.0", features = ["tempo", "client"] }
num-bigint = "0.4"
num-traits = "0.2"
schemars = "1.2"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
